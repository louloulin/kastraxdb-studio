name: Deploy

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Build with Gradle
      run: ./gradlew build -x test
    
    - name: Extract version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
    
    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ env.VERSION }}
        draft: false
        prerelease: false
    
    - name: Upload Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./magicdb-server-web-start/build/libs/magicdb-server-web-start-${{ env.VERSION }}.jar
        asset_name: magicdb-server-${{ env.VERSION }}.jar
        asset_content_type: application/java-archive
    
    - name: Deploy to Development
      if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-dev')
      run: |
        echo "Deploying to development environment..."
        # Add deployment script for development environment
    
    - name: Deploy to Staging
      if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-rc')
      run: |
        echo "Deploying to staging environment..."
        # Add deployment script for staging environment
    
    - name: Deploy to Production
      if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-')
      run: |
        echo "Deploying to production environment..."
        # Add deployment script for production environment
