<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数据服务菜单</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      margin: 0;
      padding: 20px;
      color: #333;
    }
    .menu-container {
      max-width: 800px;
      margin: 0 auto;
    }
    .menu-title {
      font-size: 24px;
      margin-bottom: 20px;
      color: #1890ff;
    }
    .menu-list {
      list-style: none;
      padding: 0;
    }
    .menu-item {
      padding: 12px 16px;
      margin-bottom: 8px;
      background-color: #f5f5f5;
      border-radius: 4px;
      display: flex;
      align-items: center;
      cursor: pointer;
      transition: all 0.3s;
    }
    .menu-item:hover {
      background-color: #e6f7ff;
    }
    .menu-item-icon {
      margin-right: 10px;
      color: #1890ff;
    }
    .menu-item-name {
      font-size: 16px;
      flex: 1;
    }
    .menu-item-description {
      color: #888;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="menu-container">
    <h1 class="menu-title">数据服务菜单</h1>
    <ul class="menu-list">
      <li class="menu-item" onclick="location.href='/data-service'">
        <span class="menu-item-icon">📊</span>
        <span class="menu-item-name">服务管理</span>
        <span class="menu-item-description">管理数据服务和分组</span>
      </li>
      <li class="menu-item" onclick="location.href='/data-service/test'">
        <span class="menu-item-icon">🧪</span>
        <span class="menu-item-name">服务测试</span>
        <span class="menu-item-description">测试数据服务执行</span>
      </li>
      <li class="menu-item" onclick="location.href='/data-service/doc'">
        <span class="menu-item-icon">📝</span>
        <span class="menu-item-name">服务文档</span>
        <span class="menu-item-description">查看数据服务API文档</span>
      </li>
    </ul>
  </div>

  <script src="/static/data-service/menu-register.js"></script>
</body>
</html>
