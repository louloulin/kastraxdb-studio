spring:
  datasource:
    # Configure the relative path of the built-in database
    url: jdbc:h2:~/.magicdb/db/magicdb_dev;FILE_LOCK=NO;MODE=MYSQL
    driver-class-name: org.h2.Driver
# The port number
server:
  port: 10821

magicdb:
  gateway:
    base-url: http://test.sqlgpt.cn/gateway
    model-base-url: http://test.sqlgpt.cn/gateway