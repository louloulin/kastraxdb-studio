<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MagicDB 正在加载...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f5f5f5;
      color: #333;
      overflow: hidden;
    }
    
    .container {
      text-align: center;
      padding: 2rem;
    }
    
    .logo {
      width: 120px;
      height: 120px;
      margin-bottom: 1.5rem;
    }
    
    h1 {
      font-size: 1.8rem;
      margin-bottom: 1rem;
      font-weight: 500;
    }
    
    p {
      font-size: 1rem;
      color: #666;
      margin-bottom: 2rem;
    }
    
    .spinner {
      display: inline-block;
      width: 50px;
      height: 50px;
      border: 3px solid rgba(0, 0, 0, 0.1);
      border-radius: 50%;
      border-top-color: #3498db;
      animation: spin 1s ease-in-out infinite;
    }
    
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
    
    .progress {
      width: 300px;
      height: 4px;
      background-color: #e0e0e0;
      border-radius: 2px;
      margin: 1.5rem auto;
      overflow: hidden;
    }
    
    .progress-bar {
      height: 100%;
      width: 0;
      background-color: #3498db;
      animation: progress 3s ease-in-out infinite;
    }
    
    @keyframes progress {
      0% {
        width: 0;
      }
      50% {
        width: 70%;
      }
      100% {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="icons/128x128.png" alt="MagicDB Logo" class="logo">
    <h1>MagicDB 正在启动</h1>
    <p>请稍候，正在加载应用程序...</p>
    <div class="progress">
      <div class="progress-bar"></div>
    </div>
    <div class="spinner"></div>
  </div>
</body>
</html>
