<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>MagicDB</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #f5f5f5;
      color: #333;
    }
    .container {
      text-align: center;
      max-width: 600px;
      padding: 20px;
    }
    h1 {
      color: #1890ff;
      margin-bottom: 20px;
    }
    .logo {
      width: 120px;
      height: 120px;
      margin-bottom: 20px;
    }
    .spinner {
      display: inline-block;
      width: 50px;
      height: 50px;
      border: 3px solid rgba(24, 144, 255, 0.3);
      border-radius: 50%;
      border-top-color: #1890ff;
      animation: spin 1s ease-in-out infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .status {
      margin: 20px 0;
      padding: 10px;
      border-radius: 4px;
      background-color: #f0f0f0;
      max-width: 100%;
      min-height: 60px;
      max-height: 150px;
      overflow-y: auto;
      text-align: left;
    }
    .buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 20px;
    }
    button {
      padding: 10px 20px;
      background-color: #1890ff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    button:hover {
      background-color: #40a9ff;
    }
    .progress-bar {
      width: 100%;
      height: 6px;
      background-color: #e9e9e9;
      border-radius: 3px;
      margin-top: 20px;
      overflow: hidden;
    }
    .progress {
      height: 100%;
      background-color: #1890ff;
      width: 0%;
      transition: width 0.3s;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>MagicDB</h1>
    <div class="spinner"></div>
    <p>正在连接到服务...</p>
    <div class="progress-bar">
      <div class="progress" id="progress"></div>
    </div>
    <div class="status" id="status">正在初始化...</div>
    <div class="buttons">
      <button id="reload">重新加载</button>
      <button id="direct">直接访问前端</button>
      <button id="debug">打开调试工具</button>
    </div>
  </div>
  
  <script>
    const statusDiv = document.getElementById('status');
    const progressBar = document.getElementById('progress');
    let progress = 0;
    let connected = false;
    let attempts = 0;
    const maxAttempts = 30;
    
    // 显示状态信息
    function showStatus(message) {
      const now = new Date();
      const time = now.toLocaleTimeString();
      statusDiv.innerHTML += `<div>[${time}] ${message}</div>`;
      statusDiv.scrollTop = statusDiv.scrollHeight;
      console.log(message);
    }
    
    // 更新进度条
    function updateProgress(value) {
      progress = value;
      progressBar.style.width = `${progress}%`;
    }
    
    // 重新加载按钮
    document.getElementById('reload').addEventListener('click', () => {
      showStatus('正在重新加载...');
      window.location.reload();
    });
    
    // 直接访问前端按钮
    document.getElementById('direct').addEventListener('click', () => {
      showStatus('正在直接访问前端...');
      window.location.href = 'http://localhost:8000';
    });
    
    // 打开调试工具按钮
    document.getElementById('debug').addEventListener('click', () => {
      showStatus('正在打开调试工具...');
      if (window.electronApi) {
        window.electronApi.openDevTools();
      } else {
        showStatus('错误: electronApi 不可用');
      }
    });
    
    // 尝试连接到前端服务
    function tryConnect() {
      if (connected) return;
      
      attempts++;
      const progressValue = Math.min(90, (attempts / maxAttempts) * 90);
      updateProgress(progressValue);
      
      showStatus(`尝试连接到前端服务... (${attempts}/${maxAttempts})`);
      
      fetch('http://localhost:8000')
        .then(response => {
          if (response.ok) {
            connected = true;
            updateProgress(100);
            showStatus('连接成功，正在跳转...');
            
            // 通知主进程前端服务已就绪
            if (window.electronApi) {
              window.electronApi.serverReady('http://localhost:8000');
            }
            
            // 延迟一秒再跳转，让用户看到成功信息
            setTimeout(() => {
              window.location.href = 'http://localhost:8000';
            }, 1000);
          } else {
            showStatus(`前端服务返回错误状态码: ${response.status}`);
            if (attempts < maxAttempts) {
              setTimeout(tryConnect, 2000);
            } else {
              showStatus('达到最大尝试次数，请手动点击"直接访问前端"按钮');
            }
          }
        })
        .catch(error => {
          showStatus(`无法连接到前端服务: ${error.message}`);
          if (attempts < maxAttempts) {
            setTimeout(tryConnect, 2000);
          } else {
            showStatus('达到最大尝试次数，请手动点击"直接访问前端"按钮');
          }
        });
    }
    
    // 开始尝试连接
    showStatus('正在等待前端服务启动...');
    setTimeout(() => {
      updateProgress(10);
      tryConnect();
    }, 1000);
  </script>
</body>
</html>
